<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeeeed">
  <meta name="description" content="個人品牌入口｜作品、想法與聯絡方式。">
  <title>YOUR NAME — Personal Links</title>
  <style>
    :root {
      --ink: #191919;
      --muted: #656565;
      --line: rgba(25,25,25,.30);
      --panel: rgba(255,255,255,.24);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #eeeeed; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(ellipse at 52% 44%, rgba(255,255,255,.92) 0, rgba(255,255,255,.50) 27%, transparent 62%),
        linear-gradient(145deg, #f8f8f7 0%, #e5e5e4 49%, #f2f2f1 73%, #d9d9d8 100%);
      overflow-x: hidden; position: relative;
    }
    body::before, body::after {
      content: ""; position: fixed; z-index: 0; pointer-events: none;
      width: 85vw; height: 30vh; min-height: 210px; border-radius: 55% 45% 0 0;
      border-top: 1px solid rgba(255,255,255,.85);
      background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(93,93,93,.13));
      transform: rotate(-19deg);
    }
    body::before { top: -23vh; right: -22vw; }
    body::after {
      bottom: -19vh; right: -20vw; width: 78vw; height: 32vh;
      background: linear-gradient(160deg, rgba(255,255,255,.20), rgba(63,63,63,.23));
      transform: rotate(-18deg);
    }
    main {
      position: relative; z-index: 1; width: min(100% - 36px, 560px);
      margin: 0 auto; padding: clamp(42px, 8vh, 88px) 0 46px; text-align: center;
    }
    .monogram {
      width: 92px; height: 92px; margin: 0 auto 30px; border: 1px solid var(--ink);
      border-radius: 50%; display: grid; place-items: center; position: relative;
      font: 36px/1 Georgia, "Times New Roman", serif; letter-spacing: -4px;
    }
    .monogram span { display: block; transform: translateX(-2px); }
    .monogram::after {
      content: ""; position: absolute; width: 70px; height: 1px;
      background: var(--ink); transform: rotate(-47deg);
    }
    h1 {
      margin: 0; font: 400 clamp(32px, 7vw, 49px)/1.2 Georgia, "Times New Roman", serif;
      letter-spacing: .20em; padding-left: .20em;
    }
    .motto {
      margin: 17px 0 0; font-size: 11px; letter-spacing: .34em;
      padding-left: .34em; color: #333;
    }
    .rule { width: 76px; height: 1px; background: var(--line); margin: 34px auto 27px; }
    .intro {
      margin: 0 auto 34px; max-width: 390px;
      font: 17px/1.95 Georgia, "Noto Serif TC", serif;
      letter-spacing: .07em; color: #414141;
    }
    .links { display: grid; gap: 11px; }
    .link {
      min-height: 66px; display: grid; grid-template-columns: 42px 1fr 24px;
      align-items: center; gap: 12px; padding: 0 21px; text-align: left;
      border: 1px solid var(--line); border-radius: 999px; color: var(--ink);
      text-decoration: none; background: var(--panel); backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background .2s ease, transform .2s ease, border-color .2s ease;
    }
    .link:hover, .link:focus-visible {
      background: rgba(255,255,255,.74); border-color: rgba(25,25,25,.62);
      transform: translateY(-2px); outline: none;
    }
    .link:focus-visible { box-shadow: 0 0 0 3px rgba(25,25,25,.16); }
    .link svg { width: 25px; height: 25px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .link .label { font: 17px/1.4 Georgia, "Noto Sans TC", serif; letter-spacing: .09em; }
    .link .arrow { width: 18px; height: 18px; justify-self: end; }
    .empty { color: var(--muted); font-size: 14px; padding: 18px; }
    .footer { margin-top: 42px; }
    .ornament {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      color: var(--muted); margin-bottom: 22px;
    }
    .ornament::before, .ornament::after { content: ""; width: 96px; height: 1px; background: var(--line); }
    .ornament span { font-size: 17px; }
    .footer p { margin: 0; font-size: 10px; letter-spacing: .38em; padding-left: .38em; color: #4c4c4c; }
    .note { margin-top: 26px; color: #737373; font-size: 11px; line-height: 1.7; }
    @media (min-width: 700px) { main { padding-top: 7vh; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="monogram" aria-label="品牌縮寫"><span id="brand-mark">L/C</span></div>
    <h1 id="brand-name">MING's</h1>
    <p class="motto" id="brand-motto">CREATE · EXPLORE · GROW</p>
    <div class="rule"></div>
    <p class="intro" id="brand-intro">一處關於過去、現在和未來的角落<br>從這裡，進入我的世界</p>

    <nav class="links" id="link-list" aria-label="個人網站連結"></nav>

    <footer class="footer">
      <div class="ornament"><span>✦</span></div>
      <p>LET’S STAY IN TOUCH</p>
      <div class="note" id="footer-note">個人品牌入口 · LINKS & WORKS</div>
    </footer>
  </main>

  <script>
    /*
      ============================================================
      快速編輯區：日後只需修改下方 BRAND 與 LINKS，不必改動版面。
      新增連結：複製一個 { ... } 項目，貼到 LINKS 陣列最後並填入資料。
      刪除連結：刪除該項目；調整順序：上下移動項目。
      所有一般連結都會在目前分頁開啟，不會另開新視窗。
      ============================================================
    */
    const BRAND = {
      name: "MING's",                 // 品牌名稱
      mark: "Y/M",                       // 圓形 Logo 文字
      motto: "CREATE · EXPLORE · GROW",  // 品牌標語
      intro: "一處關於過去、現在和未來的角落\\n從這裡，進入我的世界",
      footer: "個人品牌入口 · LINKS & WORKS"
    };

    /*
      type 可用：website、instagram、facebook、portfolio、email、youtube、
                 threads、linkedin、tiktok、x、generic
      顯示名稱與網址都可自行修改。
      email 類型請使用 mailto:your@email.com
    */
    const LINKS = [
      { name: "單字庫", url: "https://plus-pro-max-ultra.github.io/Shinnigammi-vocab/?v=v14.50%201029-1116#/library", type: "website" },
      { name: "消費記帳", url: "https://script.google.com/macros/s/AKfycbyDveN_OzLM3nVAhiSTxr3EJi6mfutYlt4_rDMjfj563gj3uAVdVv0U2O8RoLizlnSN/exec", type: "website" },
      { name: "健康登錄", url: "https://bloodflash-2e075.web.app/", type: "website" },
      { name: "內部網站", url: "https://plus-pro-max-ultra.github.io/remote-journal/", type: "website" },
      { name: "官方網站", url: "https://journal-for-far.learnman.workers.dev/", type: "website" },

      { name: "控制中心", url: "https://plus-pro-max-ultra.github.io/control-center/#s9", type: "portfolio" },
      { name: "資料中心", url: "https://github.com/plus-pro-max-ultra", type: "portfolio" },

      { name: "聯絡方式", url: "", type: "email" }

      // 新增範例：在上一筆結尾加逗號，再貼上這行即可
      // ,{ name: "YouTube", url: "https://youtube.com/@yourname", type: "youtube" }
      // ,{ name: "Threads", url: "https://threads.net/@yourname", type: "threads" }
    ];

    const ICONS = {
      website: '<rect x="3" y="4" width="18" height="13" rx="1"/><path d="M1.5 20h21M8 17l-1 3m10-3 1 3"/>',
      instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"/>',
      facebook: '<path d="M14.2 21v-8h2.7l.4-3.2h-3.1V7.7c0-.9.3-1.5 1.6-1.5h1.7V3.3c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.3H8v3.2h2.8v8"/>',
      portfolio: '<path d="M4 5.5h16v13H4zM8 5.5V3h8v2.5M4 10h16M10 10v2h4v-2"/>',
      email: '<rect x="2.5" y="4.5" width="19" height="15" rx="1"/><path d="m3.5 6 8.5 7 8.5-7"/>',
      youtube: '<rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/>',
      threads: '<path d="M18.5 9.5c-.5-3.5-2.7-5.5-6.3-5.5-4.1 0-6.7 2.9-6.7 8s2.6 8 6.7 8c3.4 0 5.6-1.8 6.1-4.7.3-2-.8-3.3-2.8-3.6-2.2-.4-4.1.7-4.1 2.5 0 1.3 1 2.1 2.3 2.1 1.9 0 3.2-1.5 3.2-3.8"/>',
      linkedin: '<path d="M5 9v10M5 5.5v.1M10 19v-6c0-2 1.2-3.5 3.2-3.5s3.3 1.3 3.3 3.5v6M10 10v9"/>',
      tiktok: '<path d="M14 4v10.5a3.5 3.5 0 1 1-3-3.46M14 4c.5 2.5 2 4 4.5 4.5"/>',
      x: '<path d="m4 4 16 16M20 4 4 20"/>',
      generic: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>'
    };

    document.title = `${BRAND.name} — Personal Links`;
    document.getElementById("brand-name").textContent = BRAND.name;
    document.getElementById("brand-mark").textContent = BRAND.mark;
    document.getElementById("brand-motto").textContent = BRAND.motto;
    document.getElementById("brand-intro").innerHTML =
      BRAND.intro.split("\\n").map(escapeHTML).join("<br>");
    document.getElementById("footer-note").textContent = BRAND.footer;

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    const linkList = document.getElementById("link-list");
    if (!LINKS.length) {
      linkList.innerHTML = '<div class="empty">目前尚無連結</div>';
    } else {
      LINKS.forEach(item => {
        const anchor = document.createElement("a");
        anchor.className = "link";
        anchor.href = item.url;
        anchor.setAttribute("aria-label", item.name);
        // 刻意不設定 target="_blank"，讓連結在目前分頁開啟。
        const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        icon.setAttribute("viewBox", "0 0 24 24");
        icon.setAttribute("aria-hidden", "true");
        icon.innerHTML = ICONS[item.type] || ICONS.generic;

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = item.name;

        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        arrow.setAttribute("class", "arrow");
        arrow.setAttribute("viewBox", "0 0 24 24");
        arrow.setAttribute("aria-hidden", "true");
        arrow.innerHTML = '<path d="m9 5 7 7-7 7"/>';

        anchor.append(icon, label, arrow);
        linkList.appendChild(anchor);
      });
    }
  </script>
</body>
</html>
